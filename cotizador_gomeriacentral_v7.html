<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F2F3F5;min-height:100vh;color:#111}
button,input,textarea{font-family:inherit}button{cursor:pointer}

.hdr-logo{height:36px;display:block;flex-shrink:0}

.sug-sep{padding:7px 14px 5px;font-size:10px;font-weight:700;color:#bbb;letter-spacing:1.5px;text-transform:uppercase;background:#fafafa;border-bottom:1px solid #f0f0f0}

.main{padding:22px;max-width:1140px;margin:0 auto}

.brand-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.tier-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap}

.t-m{background:#fce4ec;color:#880e4f}

.prod-name{font-size:13px;font-weight:600;color:#333;line-height:1.4}

.price-lista-tachado{font-size:13px;color:#bbb;text-decoration:line-through;font-weight:500}
.descuento-badge{display:inline-block;background:#E5195E;color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;margin-top:4px}
.pitch-box{background:#FAFAFA;border-left:3px solid #E5195E;padding:10px 12px;border-radius:0 8px 8px 0;font-size:12px;color:#555;line-height:1.6}
.card-footer{padding:12px 16px}
.btn-add{width:100%;padding:11px;border-radius:10px;font-weight:700;font-size:13px;transition:all .15s;cursor:pointer}
.btn-add.unsel{border:2px solid #e0e0e0;background:#fff;color:#555}

.btn-add.added{border:2px solid #E5195E;background:#E5195E;color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sheet-title{font-size:20px;font-weight:800;color:#111}
.sheet-close{background:none;border:none;font-size:28px;color:#bbb;line-height:1;padding:2px 6px;cursor:pointer}
.inp-field{width:100%;border:1.5px solid #e0e0e0;padding:10px 14px;border-radius:10px;font-size:14px;outline:none;margin-bottom:16px;transition:border .15s}

.q-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #f5f5f5;flex-wrap:nowrap;overflow:hidden}
.qty-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid #e0e0e0;background:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}

.combo-section{margin:12px 0;border:1.5px solid #f0f0f0;border-radius:12px;padding:14px}
.combo-header{font-size:13px;font-weight:700;color:#333;margin-bottom:10px}
.combo-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #fafafa;width:100%}
.combo-row:last-child{border-bottom:none}
.combo-info{flex:1;min-width:0}
.combo-label{display:block;font-size:13px;font-weight:600;color:#111}
.combo-tipo{display:block;font-size:11px;color:#E5195E;font-weight:600;margin-top:1px}
.combo-precio-input{width:90px;border:1.5px solid #e0e0e0;border-radius:8px;padding:5px 8px;font-size:13px;font-weight:700;text-align:right;color:#E5195E;outline:none}
.mp-section{margin:12px 0;border:1.5px solid #f0f0f0;border-radius:12px;padding:14px}
.mp-toggle-row{margin-bottom:12px}
.mp-title{font-size:13px;font-weight:700;color:#333}
.mp-table{width:100%;border-collapse:collapse;font-size:12px}
.mp-table th{background:#f8f8f8;padding:6px 8px;text-align:left;font-size:10px;font-weight:700;color:#aaa;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid #f0f0f0}

@media(max-width:640px){
  .hdr{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}
  .hdr-logo{height:30px}
  .hdr-spacer{display:none}
  .search-bar{top:auto;position:relative}
  .main{padding:14px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="loading-screen" class="loading-screen" style="display:flex">
    <div class="loading-spinner"></div>
  <div id="loading-msg" class="loading-msg">Cargando catalogo...</div>
  <div id="loading-sub" class="loading-sub"></div>
</div>
<header class="hdr">
  <span style="color:#E5195E;font-weight:900;font-size:18px">GOMERIA CENTRAL</span>
  <div class="hdr-div"></div>
  <div class="medida-group">
    <input id="inp-ancho" class="medida-field f-ancho" type="number" placeholder="225" min="0" max="999">
    <span class="medida-sep">/</span>
    <input id="inp-perfil" class="medida-field f-perfil" type="number" placeholder="45" min="0" max="99">
    <span class="medida-sep">R</span>
    <input id="inp-rodado" class="medida-field f-rodado" type="number" placeholder="17" min="0" max="99">
  </div>
  <button class="btn-brand" onclick="buscarMedida()">Buscar</button>
  <div class="hdr-spacer"></div>
  <button class="btn-quote" id="btn-quote" style="display:none">Presupuesto <span class="q-badge" id="q-count">0</span></button>
</header>
<div class="search-bar">
  <span class="search-bar-label">O busca por marca / producto:</span>
  <div class="search-text-wrap">
    <i class="ti ti-search search-text-icon"></i>
    <input id="inp-search" class="search-text-input" placeholder="Ej: Michelin, KUMHO..." autocomplete="off" spellcheck="false">
    <div id="suggestions" class="suggestions"></div>
  </div>
  <button class="btn-brand-sm" onclick="buscarTexto()">Buscar</button>
  <button class="btn-brand-sm" style="background:#555;margin-left:4px" onclick="loadCatalog()">&#8635; Actualizar</button>
</div>
<main class="main">
  <div id="msg-bar" style="display:none"></div>
  <section id="results-section" style="display:none">
    <div class="res-header"><div class="res-title" id="res-title"></div><div class="res-sub">Ordenado de menor a mayor precio</div></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<div id="overlay" class="overlay" style="display:none">
  <div class="sheet">
    <div class="sheet-hdr"><div class="sheet-title">Armar Presupuesto</div><button class="sheet-close" onclick="document.getElementById('overlay').style.display='none'">&#x2715;</button></div>
    <input id="inp-client" class="inp-field" placeholder="Nombre del cliente (opcional)">
    <div id="sheet-rows"></div>
    <div id="combo-section"></div>
    <div id="mp-section"></div>
    <textarea id="inp-obs" class="obs-field" placeholder="Observaciones, condiciones de pago..."></textarea>
    <button class="btn-print" onclick="printQ()">Descargar / Imprimir Presupuesto</button>
  </div>
</div>
<script>
var STORE_URL = 'https://www.gomeriacentral.com/productos/';
var catalogo = [], resultados = [], selected = {};
var suggestTimer = null, activeSugIdx = -1;

function $(id){ return document.getElementById(id); }

/* ── CARGAR CATALOGO desde catalog.json ── */
async function loadCatalog() {
  showLoading('Cargando catalogo...', '');
  try {
    var url = './catalog.json?t=' + Date.now();
    var res = await fetch(url);
    if (!res.ok) {
      if (res.status === 404) {
        hideLoading();
        setMsg('catalog.json no encontrado. Ejecuta el workflow en GitHub Actions para generarlo.', 'warn');
        showUpdateInstructions();
        return;
      }
      throw new Error('Error ' + res.status);
    }
    var data = await res.json();
    var products = data.products || data;
    var updatedAt = data.updated_at ? new Date(data.updated_at).toLocaleString('es-AR') : '';
    catalogo = flattenProducts(products);
    try { localStorage.setItem('cat_gc', JSON.stringify(catalogo)); } catch(e) {}
    hideLoading();
    var vis  = catalogo.filter(isDisponible).length;
    var imgs = catalogo.filter(function(it){ return it._imagen; }).length;
    setMsg('Catalogo listo - ' + catalogo.length + ' productos - ' + vis + ' disponibles' + (updatedAt ? ' - Actualizado: ' + updatedAt : ''), 'ok');
  } catch(err) {
    hideLoading();
    try {
      var cached = localStorage.getItem('cat_gc');
      if (cached) {
        catalogo = JSON.parse(cached);
        var vis2 = catalogo.filter(isDisponible).length;
        setMsg('Usando cache local - ' + catalogo.length + ' productos - ' + vis2 + ' disponibles', 'warn');
        return;
      }
    } catch(e2) {}
    setMsg('Error: ' + (err.message || 'No se pudo cargar el catalogo'), 'err');
    showUpdateInstructions();
  }
}

function showUpdateInstructions() {
  var mb = $('msg-bar');
  if (!mb) return;
  var existing = $('update-instructions');
  if (existing) return;
  mb.insertAdjacentHTML('afterend',
    '<div id="update-instructions" style="background:#eff6ff;border:1px solid #bae6fd;border-radius:10px;padding:14px 16px;margin-bottom:16px;font-size:13px;color:#1e40af">'
    + '<strong>Para generar el catalogo:</strong><br>'
    + '1. Ir a tu repositorio en GitHub<br>'
    + '2. Click en Actions - Actualizar Catalogo Tiendanube<br>'
    + '3. Click en Run workflow<br>'
    + '4. Esperar 2 minutos y click en el boton Actualizar'
    + '</div>');
}

function showLoading(msg, sub) {
  var ls = $('loading-screen'); if (ls) ls.style.display = 'flex';
  var lm = $('loading-msg');   if (lm) lm.textContent = msg;
  var lb = $('loading-sub');   if (lb) lb.textContent = sub || '';
}
function hideLoading() { var ls = $('loading-screen'); if (ls) ls.style.display = 'none'; }

/* ── UTILIDADES ── */
function getLocale(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj.es || obj.pt || obj.en || Object.values(obj)[0] || '';
}

function flattenProducts(products) {
  var items = [];
  products.forEach(function(prod) {
    var nombre = getLocale(prod.name);
    var marca  = prod.brand || '';
    var imagen = '';
    if (prod.images && prod.images.length > 0) {
      var img0 = prod.images[0];
      imagen = (typeof img0 === 'string') ? img0 : (img0.src || img0.url || '');
    }
    var slug    = getLocale(prod.handle);
    var visible = prod.published ? 'SI' : 'NO';
    (prod.variants || []).forEach(function(v) {
      var vals  = (v.values || []).map(function(val){ return getLocale(val) || String(val || ''); });
      var stock = v.stock === null ? 9999 : (parseInt(v.stock) || 0);
      items.push({
        Nombre:                 nombre,
        Marca:                  marca,
        Precio:                 String(v.price || '0'),
        'Precio promocional':   v.promotional_price ? String(v.promotional_price) : '',
        Stock:                  String(stock),
        'Mostrar en tienda':    visible,
        'Identificador de URL': slug,
        'Valor de propiedad 1': vals[0] || '',
        'Valor de propiedad 2': vals[1] || '',
        'Valor de propiedad 3': vals[2] || '',
        _imagen: imagen
      });
    });
  });
  return items;
}

/* ── CSV FALLBACK ── */
function handleFile(file) {
  if (!file) return;
  setMsg('Cargando catalogo...', 'info');
  Papa.parse(file, {
    header: true, delimiter: ';', skipEmptyLines: true, encoding: 'ISO-8859-1',
    complete: function(r) {
      catalogo = r.data;
      try { localStorage.setItem('cat_gc', JSON.stringify(catalogo)); } catch(e) {}
      var vis = catalogo.filter(isDisponible).length;
      setMsg('Catalogo CSV - ' + catalogo.length + ' productos - ' + vis + ' disponibles', 'ok');
    },
    error: function() { setMsg('Error al leer el CSV', 'err'); }
  });
}

/* ── MEDIDA ── */
function getMedida(it) {
  var a = String(it['Valor de propiedad 1'] || '').trim();
  var p = String(it['Valor de propiedad 2'] || '').trim();
  var r = String(it['Valor de propiedad 3'] || '').trim();
  function c(s){ return s.replace(/\.0+$/, ''); }
  return (a && p && r) ? c(a) + '/' + c(p) + ' R' + c(r) : '';
}
function norm(s) { return String(s || '').toUpperCase().replace(/\s+/g, '').replace(/-/g, '/').trim(); }
function getMedidaQuery() {
  var a = $('inp-ancho')  ? $('inp-ancho').value.trim()  : '';
  var p = $('inp-perfil') ? $('inp-perfil').value.trim() : '';
  var r = $('inp-rodado') ? $('inp-rodado').value.trim() : '';
  return (a && p && r) ? a + '/' + p + ' R' + r : '';
}

/* ── PRECIOS ── */
function parsePrecio(raw) {
  var s = String(raw || '0').trim().replace(/[^0-9.,]/g, '');
  if (!s) return 0;
  var ld = s.lastIndexOf('.'), lc = s.lastIndexOf(',');
  if (ld > -1 && lc > -1)
    return ld > lc ? (parseFloat(s.replace(/,/g, '')) || 0) : (parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0);
  if (ld > -1) {
    var pts = s.split('.');
    return (pts.length > 2 || pts[pts.length-1].length === 3) ? (parseFloat(s.replace(/\./g, '')) || 0) : (parseFloat(s) || 0);
  }
  if (lc > -1)
    return s.substring(lc+1).length === 3 ? (parseFloat(s.replace(/,/g, '')) || 0) : (parseFloat(s.replace(',', '.')) || 0);
  return parseFloat(s) || 0;
}
function isValidPrice(v) {
  var s = String(v || '').trim();
  return s !== '' && s !== 'nan' && s !== 'NaN' && s !== '0' && s !== '0.00' && s !== '0,00';
}
function getPrecioLista(it)  { return parsePrecio(it.Precio || it['Precio']); }
function getPrecioPromo(it)  {
  if (!isValidPrice(it['Precio promocional'])) return 0;
  var v = parsePrecio(it['Precio promocional']);
  return v > 0 ? v : 0;
}
function getPrecioEfectivo(it) { var p = getPrecioPromo(it); return p > 0 ? p : getPrecioLista(it); }
function fmt(n) { return Math.round(n).toLocaleString('es-AR'); }
function isVisible(it) { return String(it['Mostrar en tienda'] || '').trim().toUpperCase() === 'SI'; }
function isDisponible(it) { return isVisible(it) && getPrecioLista(it) > 0 && (parseInt(it.Stock || 0) || 0) > 0; }
function getURL(it) { var s = String(it['Identificador de URL'] || '').trim(); return s ? STORE_URL + s : ''; }
function pkey(it, i) { return String(it.Nombre || '').replace(/[^a-z0-9]/gi, '').slice(0, 12) + '_' + i; }
function getDescripcion(it) {
  var raw = String(it['Descripcion'] || it['Descripcion'] || '').trim();
  if (!raw || raw === 'nan') return '';
  var txt = raw.replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
  if (txt.length <= 260) return txt;
  var cut = txt.lastIndexOf(' ', 260);
  return txt.slice(0, cut > 0 ? cut : 260) + '...';
}

function buscarMedida() {
  if (!catalogo.length) { setMsg('Carga el catalogo primero.', 'err'); return; }
  var ms = getMedidaQuery();
  if (!ms) { setMsg('Completa los tres campos de medida.', 'err'); return; }
  var m = norm(ms);
  resultados = catalogo.filter(function(it){ return isDisponible(it) && norm(getMedida(it)) === m; })
    .sort(function(a,b){ return getPrecioEfectivo(a)-getPrecioEfectivo(b); });
  selected = {}; updateQuoteBtn();
  if (!resultados.length) { setMsg('Sin resultados para ' + ms, 'warn'); $('results-section').style.display='none'; return; }
  setMsg(resultados.length + ' productos disponibles - ' + ms, 'ok');
  $('res-title').innerHTML = '<span style="color:#E5195E">' + resultados.length + '</span> opciones para <span style="color:#E5195E;font-family:monospace">' + ms + '</span>';
  $('results-section').style.display = 'block';
  renderGrid();
}

/* ── BUSQUEDA TEXTO ── */
function onTextInput() {
  clearTimeout(suggestTimer);
  var val = $('inp-search') ? $('inp-search').value.trim() : '';
  if (!val || val.length < 2 || !catalogo.length) { hideSugg(); return; }
  suggestTimer = setTimeout(function(){ buildSugg(val); }, 200);
}
function buildSugg(query) {
  var drop = $('suggestions'); if (!drop) return;
  drop.innerHTML = ''; activeSugIdx = -1;
  var q = query.toLowerCase();
  var marcas = {};
  catalogo.forEach(function(it) {
    if (!isDisponible(it)) return;
    var m = String(it.Marca || '').trim();
    if (m.toLowerCase().indexOf(q) !== -1) marcas[m] = (marcas[m]||0)+1;
  });
  var ml = Object.entries(marcas).sort(function(a,b){ return b[1]-a[1]; }).slice(0,4);
  if (ml.length) {
    drop.insertAdjacentHTML('beforeend', '<div class="sug-sep">Marcas</div>');
    ml.forEach(function(e) {
      drop.insertAdjacentHTML('beforeend', '<div class="sug-item" data-q="' + e[0] + '" onclick="selectSugg(this)"><span class="sug-brand">' + e[0] + '</span><span class="sug-count">' + e[1] + ' prods</span></div>');
    });
  }
  var prods = catalogo.filter(function(it) {
    return isDisponible(it) && (String(it.Nombre||'').toLowerCase().indexOf(q)!==-1 || String(it.Marca||'').toLowerCase().indexOf(q)!==-1);
  }).slice(0,8);
  if (prods.length) {
    drop.insertAdjacentHTML('beforeend', '<div class="sug-sep">Productos</div>');
    prods.forEach(function(it) {
      var nombre = String(it.Nombre||'');
      var imgTag = it._imagen ? '<img src="'+it._imagen+'" width="36" height="36" style="object-fit:contain;border-radius:4px;flex-shrink:0;background:#f5f5f5" alt="">' : '';
      drop.insertAdjacentHTML('beforeend',
        '<div class="sug-item sug-prod" data-q="' + nombre.replace(/"/g,"'") + '" onclick="selectSugg(this)">'
        + (imgTag ? imgTag : '')
        + '<div style="flex:1;min-width:0">'
        + '<div class="sug-prod-top"><span class="sug-brand">'+(it.Marca||'')+'</span><span class="sug-med">'+getMedida(it)+'</span></div>'
        + '<div class="sug-prod-name">'+nombre.slice(0,52)+(nombre.length>52?'...':'')+'</div>'
        + '</div><span class="sug-precio">$'+fmt(getPrecioEfectivo(it))+'</span></div>');
    });
  }
  drop.style.display = drop.children.length ? 'block' : 'none';
}
function selectSugg(el) {
  var q = el.getAttribute('data-q');
  if ($('inp-search')) $('inp-search').value = q;
  hideSugg(); buscarTexto(q);
}
function hideSugg() { var d=$('suggestions'); if(d) d.style.display='none'; activeSugIdx=-1; }
function navSugg(dir) {
  var items=$('suggestions')?$('suggestions').querySelectorAll('.sug-item'):[];
  if (!items.length) return;
  items.forEach(function(el){ el.classList.remove('active'); });
  activeSugIdx=(activeSugIdx+dir+items.length)%items.length;
  items[activeSugIdx].classList.add('active');
  items[activeSugIdx].scrollIntoView({block:'nearest'});
}
function buscarTexto(qOverride) {
  if (!catalogo.length) { setMsg('Carga el catalogo primero.', 'err'); return; }
  var query=(qOverride||($('inp-search')?$('inp-search').value:'')).trim();
  if (!query) { setMsg('Escribe una marca o nombre.', 'err'); return; }
  hideSugg();
  var q = query.toLowerCase();
  resultados = catalogo.filter(function(it) {
    return isDisponible(it) && (String(it.Nombre||'').toLowerCase().indexOf(q)!==-1 || String(it.Marca||'').toLowerCase().indexOf(q)!==-1);
  }).sort(function(a,b){ return getPrecioEfectivo(a)-getPrecioEfectivo(b); });
  selected={}; updateQuoteBtn();
  if (!resultados.length) { setMsg('Sin resultados para '+query, 'warn'); $('results-section').style.display='none'; return; }
  setMsg(resultados.length + ' resultados para '+query, 'ok');
  $('res-title').innerHTML = '<span style="color:#E5195E">'+resultados.length+'</span> resultados para "<span style="color:#E5195E">'+query+'</span>"';
  $('results-section').style.display='block';
  renderGrid();
}

    var key=pkey(it,i);
    var pL=getPrecioLista(it),pP=getPrecioPromo(it),pE=pP>0?pP:pL;
    var tienePromo=pP>0&&pP<pL;
    var diff=i>0?(((pE-base)/base)*100).toFixed(1):null;
    var isSel=!!selected[key];
    var marca=String(it.Marca||'').toUpperCase().trim();
    var tier=getTier(marca);
    var stk=parseInt(it.Stock||0)||0;
    var desc=getDescripcion(it);
    var url=getURL(it);
    var img=it._imagen||'';
    var stkCls=stk>5?'stk-ok':stk>0?'stk-low':'stk-no';
    var stkTxt=stk>5?(stk===9999?'Disponible':stk+' unid.'):stk>0?'Pocas unidades':'Sin stock';
    var linkHtml=url?'<a href="'+url+'" target="_blank" class="prod-link">Ver en la tienda</a>':'';
    var priceHtml=tienePromo
      ?'<div class="price-wrap"><span class="price p-promo">$'+fmt(pP)+'</span><span class="price-lista-tachado">$'+fmt(pL)+'</span></div><div class="descuento-badge">-'+Math.round((1-pP/pL)*100)+'% OFF</div>'
      :'<span class="price '+(i===0?'p-first':'p-rest')+'">$'+fmt(pE)+'</span>';
    var imgHtml='<div class="card-img-wrap">'
      +(img?'<img src="'+img+'" class="card-img" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="card-img-placeholder" style="display:none">🛞</div>':'<div class="card-img-placeholder">🛞</div>')

      +'<div class="card-banner '+(i===0?'first':'rest')+'">'
      +(i===0?'<span class="banner-lbl-1">MEJOR PRECIO</span><span style="color:rgba(255,255,255,.5);font-size:10px">#1</span>':'<span class="banner-lbl-n">#'+(i+1)+'</span>'+(diff?'<span class="banner-diff">+'+diff+'% vs el mas barato</span>':''))

      +'<div class="prod-name">'+(it.Nombre||'')+'</div>'

      +'<div><span class="stat-label">Stock</span><span class="stat-val '+stkCls+'">'+stkTxt+'</span></div>'
      +'<div class="price-block"><span class="stat-label">Precio u.</span>'+priceHtml+'</div>'
      +'</div>'
      +(desc?'<div class="pitch-box">'+desc+'</div>':'')
      +'</div>'
      +'<div class="card-footer"><button class="btn-add '+(isSel?'added':'unsel')+'" onclick="toggleSel('+i+',\''+key+'\')">'
      +(isSel?'En el presupuesto':'Agregar al presupuesto')

  });

/* ── SELECCION ── */
function toggleSel(idx,key) {
  if (selected[key]) { delete selected[key]; }
  else { selected[key]={product:resultados[idx],qty:4,key:key,url:getURL(resultados[idx]),imagen:resultados[idx]._imagen||''}; }
  refreshCard(idx,key); updateQuoteBtn();
}
function refreshCard(idx,key) {
  var card=$('card-'+key); if(!card) return;
  var isSel=!!selected[key];
  card.className='card'+(isSel?' sel':'');
  var btn=card.querySelector('.btn-add');
  if(btn){ btn.className='btn-add '+(isSel?'added':'unsel'); btn.textContent=isSel?'En el presupuesto':'Agregar al presupuesto'; }
}
function updateQuoteBtn() {
  var n=Object.keys(selected).length;
  var qc=$('q-count'); if(qc) qc.textContent=n;
  var bq=$('btn-quote'); if(bq) bq.style.display=n>0?'flex':'none';
}
function adjQty(key,delta) {
  if (!selected[key]) return;
  selected[key].qty=Math.max(1,(selected[key].qty||1)+delta);
  var qEl=$('qty-'+key), sEl=$('sub-'+key);
  if(qEl) qEl.textContent=selected[key].qty;
  if(sEl) sEl.textContent='$'+fmt(getPrecioEfectivo(selected[key].product)*selected[key].qty);
}

      +'<div style="font-weight:700;font-size:12px;color:#111;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(item.product.Marca||'')+' — '+(item.product.Nombre||'')+'</div>'
      +'<div style="font-size:11px;color:#aaa;font-family:monospace;margin-top:1px">'+getMedida(item.product)+'</div>'
      +'<div style="margin-top:4px">'+precioLine+'</div>'
      +'<div style="font-size:11px;color:#888;margin-top:2px">Subtotal: <strong>$'+fmt(sub)+'</strong></div>'
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0">'
      +'<div style="display:flex;align-items:center;gap:4px">'
      +'<button class="qty-btn" onclick="adjQty(\''+item.key+'\',-1)">-</button>'
      +'<span class="qty-num" id="qty-'+item.key+'">'+item.qty+'</span>'
      +'<button class="qty-btn" onclick="adjQty(\''+item.key+'\',+1)">+</button>'
      +'</div>'
      +'<button onclick="removeFromQuote(\''+item.key+'\')" title="Eliminar" '
      +'style="background:none;border:none;color:#ccc;cursor:pointer;font-size:18px;padding:2px;line-height:1">&#128465;</button>'
      +'</div>'
      +'</div>');
  });
  renderCombosModal();
  renderMediosModal();
}

/* ── IMPRIMIR PDF ── */
function printQ() {
  var client=($('inp-client')?$('inp-client').value:'').trim();
  var obs=($('inp-obs')?$('inp-obs').value:'').trim();
  var date=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  var quoteNum=Math.floor(Math.random()*90000)+10000;
  var logoSrc=$('__logo__')?$('__logo__').src:'';
  var selList=Object.values(selected);
  var medios=getMedios().filter(function(m){ return m.activo&&m.tipo==='cuotas'; });

  /* Tarjetas de producto — 2 por fila, precio individual, sin total */
  var cardRows='';
  for (var i=0; i<selList.length; i+=2) {
    var cards=[selList[i],selList[i+1]].filter(Boolean).map(function(item) {
      var p=getPrecioEfectivo(item.product);
      var lista=getPrecioLista(item.product);
      var promo=getPrecioPromo(item.product);
      var ef=p*0.87;  /* 13% descuento efectivo */
      var tienePromo=promo>0&&promo<lista;
      var url=item.url||'';
      var mediosRows=medios.map(function(m) {
        var tot=p*(1+m.valor/100);
        return '<tr style="border-bottom:1px solid #f5f5f5">'
          +'<td style="padding:5px 8px;font-size:11px">'+m.label+'</td>'
          +'<td style="padding:5px 8px;text-align:right;font-size:11px;font-weight:700">$'+fmt(tot/m.cuotas)+'/cuota</td></tr>';
      }).join('');
      var imgTag=item.imagen
        ?'<img src="'+item.imagen+'" style="width:80px;height:80px;object-fit:contain;display:block;margin:0 auto 8px" alt="">'
        :'<div style="font-size:40px;text-align:center;margin-bottom:8px">🛞</div>';
      var urlTag=url
        ?'<div style="margin-top:8px;text-align:center"><a href="'+url+'" style="font-size:10px;color:#E5195E;word-break:break-all">'+url+'</a></div>'
        :'';
      var qrTag=url
        ?'<div style="text-align:center;margin-top:10px;padding-top:10px;border-top:1px solid #eee">'
          +'<img src="https://api.qrserver.com/v1/create-qr-code/?size=80x80&data='+encodeURIComponent(url)+'" width="72" height="72" alt="QR" style="display:block;margin:0 auto 4px">'
          +'<div style="font-size:9px;color:#aaa">Escanear para ver / comprar online</div>'
          +'</div>'
        :'';
      return '<td style="width:50%;vertical-align:top;padding:12px">'
        +'<div style="border:1px solid #eee;border-radius:10px;overflow:hidden">'
        +'<div style="background:#f8f8f8;padding:14px;text-align:center;border-bottom:1px solid #eee">'
        +imgTag
        +'<div style="font-size:16px;font-weight:900;color:#111">'+(item.product.Marca||'')+'</div>'
        +'<div style="font-size:11px;color:#666;margin-top:2px">'+String(item.product.Nombre||'').slice(0,50)+'</div>'
        +'<div style="font-family:monospace;font-size:12px;color:#E5195E;font-weight:700;margin-top:4px">'+getMedida(item.product)+'</div>'
        +'<div style="font-size:11px;color:#888;margin-top:2px">Cantidad: '+item.qty+'</div>'
        +urlTag
        +qrTag
        +'</div>'
        +'<div style="padding:12px">'
        +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa;margin-bottom:4px"><span>Precio lista</span><span'+(tienePromo?' style="text-decoration:line-through"':'')+'>$'+fmt(lista)+'</span></div>'
        +(tienePromo?'<div style="background:#E5195E;color:#fff;border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:11px;font-weight:700">Precio promocional</span><span style="font-size:15px;font-weight:900">$'+fmt(promo)+'</span></div>':'')
        +'<div style="background:#E5195E;color:#fff;border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:11px;font-weight:700">Efectivo / Transferencia (-13%)</span><span style="font-size:15px;font-weight:900">$'+fmt(ef)+'</span></div>'
        +(mediosRows?'<table style="width:100%;border-collapse:collapse">'+mediosRows+'</table>':'')
        +'</div></div></td>';
    });
    cardRows+='<tr>'+cards.join('')+'</tr>';
  }

  var html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Presupuesto #'+quoteNum+' - Gomeria Central</title>'
    +'<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#111;background:#fff;padding:28px}@media print{body{padding:16px}@page{margin:1cm}}</style>'
    +'</head><body>'
    /* header */
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:20px"><tr>'
    +'<td style="width:50%;vertical-align:middle"><img src="'+logoSrc+'" style="height:52px" alt="Gomeria Central"></td>'
    +'<td style="text-align:right;vertical-align:top">'
    +'<div style="font-size:22px;font-weight:900;color:#E5195E">PRESUPUESTO</div>'
    +'<div style="font-size:13px;color:#555;margin-top:4px;line-height:2">N <strong>'+quoteNum+'</strong><br>Fecha: '+date+(client?'<br>Cliente: <strong>'+client+'</strong>':'')+'</div>'
    +'</td></tr></table>'
    +'<hr style="border:none;border-top:3px solid #E5195E;margin-bottom:20px">'
    /* productos */
    +'<table style="width:100%;border-collapse:collapse;margin-bottom:4px">'+cardRows+'</table>'
    /* combos */
    +buildCombosHTML()
    /* observaciones */
    +(obs?'<div style="margin-top:18px;background:#fff0f5;border-left:4px solid #E5195E;padding:12px 16px;font-size:12px;line-height:1.6"><strong>Observaciones:</strong> '+obs+'</div>':'')
    /* pie: sucursales y horarios */
    +'<div style="margin-top:24px;padding-top:16px;border-top:2px solid #E5195E">'
    +'<table style="width:100%;border-collapse:collapse"><tr>'
    +'<td style="vertical-align:top;width:55%">'
    +'<div style="font-size:11px;font-weight:700;color:#E5195E;text-transform:uppercase;margin-bottom:8px">Sucursales</div>'
    +'<div style="font-size:11px;color:#555;line-height:2">Av. Colon 5256, Cordoba<br>Av. Rafael Nunez 3500<br>Av. Fuerza Aerea 2660<br>Fray Mamerto Esquiu 830</div>'
    +'</td>'
    +'<td style="vertical-align:top;text-align:right">'
    +'<div style="font-size:11px;font-weight:700;color:#E5195E;text-transform:uppercase;margin-bottom:8px">Horario de atencion</div>'
    +'<div style="font-size:11px;color:#555;line-height:2">Lunes a viernes: 8:30 a 13hs y 14:30 a 19hs<br>Sabados: 9:00 a 13:00hs</div>'
    +'</td></tr></table>'
    +'<div style="text-align:center;margin-top:12px;font-size:10px;color:#bbb">'
    +'<strong style="color:#888">GOMERIA CENTRAL</strong> - gomeriacentral.com - Cordoba, Argentina<br>'
    +'<em>Presupuesto valido sujeto a disponibilidad de stock. Precios en pesos argentinos.</em>'
    +'</div></div>'
    +'<scr'+'ipt>window.onload=function(){window.print();}<'+'/scr'+'ipt>'
    +'</body></html>';

  try{ var w=window.open('','_blank'); if(w){ w.document.write(html); w.document.close(); return; } }catch(e){}
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='presupuesto_'+quoteNum+'.html'; a.click();
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', function() {
  /* Campos medida */
  var campos=['inp-ancho','inp-perfil','inp-rodado'];
  var maxLen={'inp-ancho':3,'inp-perfil':2,'inp-rodado':2};
  campos.forEach(function(id,i) {
    var el=$(id); if(!el) return;
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'){buscarMedida();return;}
      if(e.key==='Tab'&&!e.shiftKey&&i<campos.length-1){e.preventDefault();$(campos[i+1]).focus();}
    });
    el.addEventListener('input',function(){
      if(i<campos.length-1&&el.value.length>=maxLen[id])$(campos[i+1]).focus();
    });
  });

  /* Busqueda texto */
  var inp=$('inp-search');
  if(inp){
    inp.addEventListener('input',onTextInput);
    inp.addEventListener('keydown',function(e){
      var drop=$('suggestions');
      if(drop&&drop.style.display!=='none'){
        if(e.key==='ArrowDown'){e.preventDefault();navSugg(1);return;}
        if(e.key==='ArrowUp'){e.preventDefault();navSugg(-1);return;}
        if(e.key==='Enter'){var act=drop.querySelector('.sug-item.active');if(act){e.preventDefault();selectSugg(act);return;}}
      }
      if(e.key==='Enter') buscarTexto();
      if(e.key==='Escape') hideSugg();
    });
  }
  document.addEventListener('click',function(e){if(!e.target.closest('.search-text-wrap'))hideSugg();});

  /* Presupuesto */
  var bq=$('btn-quote');
  if(bq) bq.addEventListener('click',function(){ renderSheet(); var ov=$('overlay'); if(ov) ov.style.display='flex'; });
  var ov=$('overlay');
  if(ov) ov.addEventListener('click',function(e){ if(e.target===ov) ov.style.display='none'; });
  var bp=$('btn-print');
  if(bp) bp.addEventListener('click',printQ);

  /* Drag drop CSV */
  var uz=$('upload-zone');
  if(uz){
    uz.addEventListener('dragover',function(e){e.preventDefault();uz.classList.add('drag');});
    uz.addEventListener('dragleave',function(){uz.classList.remove('drag');});
    uz.addEventListener('drop',function(e){
      e.preventDefault();uz.classList.remove('drag');
      var f=e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f&&f.name.toLowerCase().endsWith('.csv'))handleFile(f);
    });
  }

  /* Cargar catalogo al arrancar */
  loadCatalog();
});

</script>
